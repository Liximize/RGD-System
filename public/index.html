<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RGD Dashboard</title><link rel="stylesheet" href="/styles.css"></head><body>
<div id="login" class="center"><form id="loginForm" class="card login"><div class="brand">RGD</div><h1>Private Dashboard</h1><p>Enter your dashboard password.</p><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button>Sign in</button><div id="loginError" class="error"></div></form></div>
<div id="app" class="hidden"><aside><div class="logo"><b>RGD</b><span>Dashboard</span></div><button class="nav active" data-kind="welcome">Welcome</button><button class="nav" data-kind="leave">Leave</button><button id="logout" class="logout">Sign out</button></aside><main><header><div><span class="eyebrow">SERVER CONFIGURATION</span><h1 id="pageTitle">Welcome message</h1></div><div id="guild" class="guild"></div></header>
<div class="grid"><section class="card editor"><div class="section-head"><h2>Message settings</h2><label class="switch"><input id="enabled" type="checkbox"><span></span> Enabled</label></div><label>Channel<select id="channelId"></select></label><label>Format<select id="mode"><option value="text">Normal message</option><option value="embed">Embed only</option><option value="both">Normal + embed</option></select></label><label>Normal message<textarea id="content" rows="3"></textarea></label><div class="two"><label>Embed title<input id="title"></label><label>Color<input id="color" type="color"></label></div><label>Description<textarea id="description" rows="5"></textarea></label><label>Footer<input id="footer"></label><div class="two"><label>Thumbnail URL<input id="thumbnail"></label><label>Image URL<input id="image"></label></div><div class="two"><label>Author<input id="author"></label><label>Author icon URL<input id="authorIcon"></label></div><label>Title link URL<input id="url"></label><div class="checks"><label><input id="ping" type="checkbox"> Ping member</label><label><input id="ignoreBots" type="checkbox"> Ignore bots</label><label><input id="timestamp" type="checkbox"> Timestamp</label></div><p class="hint">Placeholders: {user} {username} {displayName} {userId} {server} {memberCount} {avatar} {serverIcon}</p><div class="actions"><button id="save">Save changes</button><button id="test" class="secondary">Send test</button><span id="status"></span></div></section>
<section class="card preview-card"><div class="section-head"><h2>Discord preview</h2><span class="live">LIVE</span></div><div class="discord"><div class="avatar">RGD</div><div class="message"><b>RGD <span class="bot">APP</span></b><span class="time"> Today at 12:00</span><div id="normalPreview"></div><div id="embedPreview" class="embed"><div id="authorPreview" class="embed-author"></div><div id="titlePreview" class="embed-title"></div><div id="descriptionPreview" class="embed-desc"></div><img id="thumbPreview" class="thumb"><img id="imagePreview" class="image"><div id="footerPreview" class="footer"></div></div></div></div></section></div></main></div><script src="/app.js"></script></body></html>
